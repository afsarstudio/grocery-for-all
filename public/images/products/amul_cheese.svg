    <linearGradient id="cheeseYellow" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#cheeseBg)"/>
